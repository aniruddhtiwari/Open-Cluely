<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chat</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <!-- PrismJS theme for syntax highlighting -->
    <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css" />
    <style>
      /* Font Awesome now loaded via <link> above */

      body {
        background: transparent !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .chat-container {
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          135deg,
          rgb(17, 24, 39) 0%,
          rgb(20, 20, 20) 100%
        );
        backdrop-filter: blur(25px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        -webkit-app-region: drag;
      }
      .chat-header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        -webkit-app-region: drag;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        cursor: move;
        flex-shrink: 0;
      }
      .header-title {
        color: rgba(255, 255, 255, 0.95);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      .header-shortcut {
        color: rgba(255, 255, 255, 0.5);
        font-size: 11px;
        font-weight: 400;
      }
      /* Header actions (e.g., Clear History) */
      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .icon-button {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .icon-button:hover {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }
      .export-status {
        color: rgba(255, 255, 255, 0.8);
        font-size: 11px;
        white-space: nowrap;
      }
      .export-status.error {
        color: #ff8a94;
      }
      .recording-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4757;
        animation: pulse 2s infinite;
        display: none;
        box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
      }
      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-app-region: no-drag;
        box-sizing: border-box;
        /* Removed max-height restriction */
      }
      .message {
        margin-bottom: 16px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        border-left: 3px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        word-wrap: break-word;
        word-break: break-word;
        /* Removed all height restrictions */
        position: relative;
      }
      .message.transcription {
        background: rgba(76, 175, 80, 0.15);
        animation: fadeInSlide 0.1s ease-out;
        position: relative;
      }

      .message.transcription::before {
        position: absolute;
        left: -8px;
        top: 8px;
        font-size: 12px;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes fadeInSlide {
        from {
          opacity: 0;
          transform: translateX(-20px);
          background: rgba(76, 175, 80, 0.3);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          background: rgba(76, 175, 80, 0.15);
        }
      }
      .message.system {
        background: rgba(33, 150, 243, 0.1);
      }
      .message.error {
        background: rgba(244, 67, 54, 0.1);
      }
      .message.user {
        background: rgba(255, 152, 0, 0.1);
      }
      .message.assistant {
        background: rgba(156, 39, 176, 0.1);
        border-left: 3px solid #9c27b0;
        /* Removed all height restrictions and overflow hidden */
        display: block;
      }
      
      .message.assistant .message-text {
        /* Removed all height restrictions and overflow hidden */
        white-space: pre-wrap;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      /* Ensure all content in assistant messages is fully visible */
      .message.assistant *,
      .message.assistant .bullet-point,
      .message.assistant .numbered-point,
      .message.assistant strong,
      .message.assistant em,
      .message.assistant code,
      .message.assistant pre,
      .message.assistant ul,
      .message.assistant ol,
      .message.assistant li,
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6,
      .message.assistant p,
      .message.assistant blockquote {
        /* Remove all height restrictions */
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      
      /* Markdown formatting for assistant messages */
      .message.assistant .bullet-point {
        margin: 4px 0;
        padding-left: 8px;
        line-height: 1.4;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point {
        margin: 4px 0;
        padding-left: 16px;
        line-height: 1.4;
        position: relative;
        counter-increment: list-counter;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point::before {
        content: counter(list-counter) ". ";
        position: absolute;
        left: 0;
        font-weight: 500;
        color: rgba(156, 39, 176, 0.8);
      }
      
      .message.assistant {
        counter-reset: list-counter;
      }
      
      .message.assistant strong {
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.9);
      }
      
      .message.assistant code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 4px;
        border-radius: 3px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        display: inline;
      }
      
      /* Ensure code blocks are fully visible */
      .message.assistant pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-radius: 6px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 8px 0;
        position: relative;
      }
      
      .message.assistant pre code {
        background: transparent;
        padding: 0;
        border-radius: 0;
        display: block;
      }

      /* Copy button in code blocks */
      .copy-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0, 0, 0, 0.5);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 4px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
      }
      .copy-btn:hover {
        background: rgba(0,0,0,0.7);
      }
      .copy-btn.copied {
        background: rgba(76, 175, 80, 0.8);
        border-color: rgba(76, 175, 80, 0.9);
        transform: scale(0.98);
      }
      
      /* Ensure lists are fully visible */
      .message.assistant ul,
      .message.assistant ol {
        margin: 8px 0;
        padding-left: 20px;
      }
      
      .message.assistant li {
        margin: 4px 0;
        line-height: 1.4;
      }
      
      /* Ensure headings are fully visible */
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 {
        margin: 12px 0 8px 0;
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant h1 { font-size: 16px; }
      .message.assistant h2 { font-size: 15px; }
      .message.assistant h3 { font-size: 14px; }
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 { font-size: 13px; }
      
      /* Ensure paragraphs are fully visible */
      .message.assistant p {
        margin: 8px 0;
      }
      
      /* Ensure blockquotes are fully visible */
      .message.assistant blockquote {
        border-left: 3px solid rgba(156, 39, 176, 0.5);
        padding-left: 12px;
        margin: 8px 0;
        font-style: italic;
        color: rgba(255, 255, 255, 0.8);
      }
      
      /* Thinking indicator animation */
      .thinking-dots {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      
      .thinking-dots .dot {
        opacity: 0.4;
        animation: thinking 1.4s infinite ease-in-out;
      }
      
      .thinking-dots .dot:nth-child(1) { animation-delay: 0s; }
      .thinking-dots .dot:nth-child(2) { animation-delay: 0.2s; }
      .thinking-dots .dot:nth-child(3) { animation-delay: 0.4s; }
      
      @keyframes thinking {
        0%, 80%, 100% {
          opacity: 0.4;
          transform: scale(1);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      
      .message.thinking {
        animation: fadeIn 0.3s ease-out;
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .message-time {
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        margin-bottom: 4px;
        font-weight: 500;
      }
      .message-text {
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        word-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        max-width: 100%;
        display: block;
      }
      .message-text .math {
        font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
        white-space: nowrap;
      }
      .message-text sup, .message-text sub {
        font-size: 0.72em;
        line-height: 0;
      }
      .chat-input {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: no-drag;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        flex-shrink: 0;
      }
      .knowledge-type-row {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        margin-bottom: 6px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 9px;
      }
      .knowledge-type-select {
        max-width: 150px;
        padding: 2px 5px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
        font-size: 9px;
        outline: none;
        -webkit-app-region: no-drag;
      }
      .knowledge-type-select option {
        background: #202124;
        color: #fff;
      }
      .session-document-strip {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 7px;
        min-height: 24px;
        overflow: hidden;
      }
      .session-document-strip[hidden] {
        display: none;
      }
      .session-document-header,
      .session-document-content {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 6px;
      }
      .session-document-count {
        flex: 1;
        color: rgba(255, 255, 255, 0.72);
        font-size: 9px;
        font-weight: 600;
      }
      .session-document-chips {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        flex: 1;
        scrollbar-width: none;
      }
      .session-document-chips::-webkit-scrollbar {
        display: none;
      }
      .session-document-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: 0 0 auto;
        max-width: 220px;
        padding: 4px 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
        font-size: 10px;
      }
      .session-document-name {
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session-document-index-status {
        color: #7ee787;
        font-size: 9px;
      }
      .session-document-authority {
        padding: 1px 4px;
        border-radius: 4px;
        background: rgba(114, 137, 218, 0.18);
        color: rgba(205, 214, 255, 0.92);
        font-size: 8px;
        white-space: nowrap;
      }
      .session-document-remove,
      .session-documents-clear {
        border: 0;
        background: transparent;
        color: rgba(255, 255, 255, 0.65);
        cursor: pointer;
        padding: 0 2px;
        font-size: 10px;
        -webkit-app-region: no-drag;
      }
      .session-document-remove:hover,
      .session-documents-clear:hover {
        color: #fff;
      }
      .session-documents-clear {
        flex: 0 0 auto;
        font-size: 9px;
      }
      .session-document-status {
        flex: 0 0 auto;
        color: rgba(255, 255, 255, 0.65);
        font-size: 9px;
        white-space: nowrap;
      }
      .session-document-status.error {
        color: #ff8a94;
      }
      .input-container {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        -webkit-app-region: no-drag;
      }
      .input-field {
        flex: 1;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        outline: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        /* make it work well as multiline */
        resize: none;
        line-height: 1.4;
        min-height: 32px;
        max-height: 140px;
        overflow-y: auto;
      }
      .input-field:focus {
        outline: none;
      }
      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      .send-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .send-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
      }
      .context-button,
      .send-button span {
        font-size: 10px;
        white-space: nowrap;
      }
      .send-button span {
        margin-left: 4px;
      }
      .status-message {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        padding: 20px;
        font-style: italic;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .error-message {
        color: #ff4757;
        font-size: 12px;
        padding: 10px;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      .mic-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .mic-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
      }
      .mic-button.recording {
        background: rgba(255, 71, 87, 0.8);
        color: white;
        box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
      }
      .attachment-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 9px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .attachment-button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
      }
      .attachment-button:disabled {
        cursor: wait;
        opacity: 0.5;
      }
      .session-url-entry {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 7px;
      }
      .session-url-entry[hidden] {
        display: none;
      }
      .session-url-input {
        min-width: 0;
        flex: 1;
        padding: 5px 7px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        outline: none;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.95);
        font-size: 10px;
        -webkit-app-region: no-drag;
      }
      .session-url-input::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }
      .session-url-submit,
      .session-url-cancel {
        border: 0;
        border-radius: 5px;
        padding: 5px 8px;
        background: rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        font-size: 9px;
        -webkit-app-region: no-drag;
      }
      .session-url-submit:disabled {
        cursor: wait;
        opacity: 0.5;
      }
      .help-text {
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        text-align: center;
        padding: 10px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .interaction-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 1000;
      }
      .interaction-indicator.show {
        opacity: 1;
      }
      .interaction-indicator.interactive {
        background: rgba(76, 175, 80, 0.9);
      }
      .interaction-indicator.non-interactive {
        background: rgba(244, 67, 54, 0.9);
      }
      .non-interactive .input-container {
        pointer-events: none;
        opacity: 0.5;
      }
      .non-interactive .mic-button {
        pointer-events: none;
        opacity: 0.5;
      }
      .non-interactive .send-button {
        pointer-events: none;
        opacity: 0.5;
      }

      /* Minimalist Listening Animation */
      .listening-indicator {
        display: none;
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(203, 203, 203, 0.3);
        border-radius: 20px;
        padding: 8px 16px;
        z-index: 1000;
        pointer-events: none;
      }

      .listening-indicator.active {
        display: flex;
        align-items: center;
        gap: 8px;
        animation: fadeInUp 0.3s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      .listening-wave {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .wave-bar {
        width: 2px;
        background: #4caf50;
        border-radius: 1px;
        animation: waveAnimation 1.2s infinite ease-in-out;
      }

      .wave-bar:nth-child(1) {
        height: 8px;
        animation-delay: 0s;
      }
      .wave-bar:nth-child(2) {
        height: 12px;
        animation-delay: 0.15s;
      }
      .wave-bar:nth-child(3) {
        height: 16px;
        animation-delay: 0.3s;
      }
      .wave-bar:nth-child(4) {
        height: 12px;
        animation-delay: 0.45s;
      }
      .wave-bar:nth-child(5) {
        height: 8px;
        animation-delay: 0.6s;
      }

      @keyframes waveAnimation {
        0%, 100% {
          transform: scaleY(0.3);
          opacity: 0.6;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .listening-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .listening-duration {
        color: rgba(76, 175, 80, 0.8);
        font-size: 10px;
        font-family: monospace;
        margin-left: 4px;
      }

      /* Interim text overlay */
      .interim-overlay {
        position: fixed;
        bottom: 80px;
        left: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.028);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(76, 175, 80, 0.3);
        border-radius: 8px;
        padding: 12px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 12px;
        font-style: italic;
        z-index: 999;
        pointer-events: none;
        display: none;
        animation: slideUpFade 0.3s ease-out;
      }

      .interim-overlay.active {
        display: block;
      }

      @keyframes slideUpFade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="header-title">
          Live Transcript & Chat <span class="header-shortcut">· Alt+T</span>
          <div class="recording-indicator" id="recordingIndicator"></div>
        </div>
        <div class="header-actions">
          <span class="export-status" id="exportStatus" role="status" aria-live="polite"></span>

            <i class="fas fa-download"></i>
          </button>
          <button class="icon-button" id="clearHistoryBtn" title="Clear chat history">
            <i class="fas fa-trash"></i>
          </button>
          <button class="icon-button" id="closeChatBtn" title="Hide Live Transcript & Chat" aria-label="Hide Live Transcript & Chat">
            <i class="fas fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Interim Text Overlay -->
      <div class="interim-overlay" id="interimOverlay"></div>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="chat-input">
        <div class="knowledge-type-row">
          <label for="knowledgeEvidenceType">Knowledge type:</label>
          <select class="knowledge-type-select" id="knowledgeEvidenceType">
            <option value="candidate">Candidate / Project</option>
            <option value="job">Job Description</option>
            <option value="reference">Reference</option>
            <option value="unknown" selected>Other / Auto</option>
          </select>
        </div>
        <div class="session-document-strip" id="sessionDocumentStrip" hidden>
          <div class="session-document-header" id="sessionDocumentHeader">
            <span class="session-document-count" id="sessionDocumentCount"></span>
            <button class="session-documents-clear" id="clearSessionDocumentsBtn" type="button">Clear all</button>
          </div>
          <div class="session-document-content">
            <div class="session-document-chips" id="sessionDocumentChips"></div>
            <span class="session-document-status" id="sessionDocumentStatus"></span>
          </div>
        </div>
        <div class="session-url-entry" id="sessionUrlEntry" hidden>
          <input class="session-url-input" id="sessionUrlInput" type="url" placeholder="https://example.com/page" aria-label="Public webpage URL">
          <button class="session-url-submit" id="submitSessionUrlBtn" type="button">Add</button>
          <button class="session-url-cancel" id="cancelSessionUrlBtn" type="button">Cancel</button>
        </div>
        <div class="input-container">
          <textarea
            class="input-field"
            placeholder="Type a question or add interview context..."
            id="messageInput"
            rows="1"
          ></textarea>
          <button class="attachment-button" id="addSessionDocumentsBtn" type="button" title="Add session documents" aria-label="Add session documents">
            <i class="fas fa-paperclip"></i>
          </button>
          <button class="attachment-button" id="showSessionUrlBtn" type="button" title="Add public URL" aria-label="Add public URL">
            <i class="fas fa-link"></i>
          </button>
          <button class="send-button context-button" id="addContextButton" type="button">Add Context</button>
          <button class="send-button" id="sendButton" type="button">
            <i class="fas fa-paper-plane"></i>
            <span>Ask AI</span>
          </button>
        </div>
      </div>
    </div>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <!-- PrismJS core and autoloader for language components -->
    <script src="./node_modules/prismjs/prism.min.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script>
      // Configure Prism autoloader
      try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) {}
    </script>
    <script>
      // Use electronAPI from preload script instead of direct require
      const whysperAPI = window.electronAPI;

      const chatMessages = document.getElementById('chatMessages');
      const recordingIndicator = document.getElementById('recordingIndicator');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const addContextButton = document.getElementById('addContextButton');
      const chatContainer = document.getElementById('chatContainer');
      const listeningIndicator = document.getElementById('listeningIndicator');
      const listeningDuration = document.getElementById('listeningDuration');
      const interimOverlay = document.getElementById('interimOverlay');
      const exportTranscriptBtn = document.getElementById('exportTranscriptBtn');
      const exportStatus = document.getElementById('exportStatus');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const closeChatBtn = document.getElementById('closeChatBtn');
      const sessionDocumentStrip = document.getElementById('sessionDocumentStrip');
      const sessionDocumentHeader = document.getElementById('sessionDocumentHeader');
      const sessionDocumentCount = document.getElementById('sessionDocumentCount');
      const sessionDocumentChips = document.getElementById('sessionDocumentChips');
      const sessionDocumentStatus = document.getElementById('sessionDocumentStatus');
      const addSessionDocumentsBtn = document.getElementById('addSessionDocumentsBtn');
      const showSessionUrlBtn = document.getElementById('showSessionUrlBtn');
      const sessionUrlEntry = document.getElementById('sessionUrlEntry');
      const sessionUrlInput = document.getElementById('sessionUrlInput');
      const submitSessionUrlBtn = document.getElementById('submitSessionUrlBtn');
      const cancelSessionUrlBtn = document.getElementById('cancelSessionUrlBtn');
      const clearSessionDocumentsBtn = document.getElementById('clearSessionDocumentsBtn');
      const knowledgeEvidenceType = document.getElementById('knowledgeEvidenceType');

      let isRecording = false;
      let isInteractive = true;
      let listeningStartTime = null;
      let listeningTimer = null;
      let speechAvailable = false;
      let sessionDocumentStatusTimer = null;
      let exportStatusTimer = null;
      const EVIDENCE_TYPE_LABELS = Object.freeze({
        candidate: 'Candidate / Project',
        job: 'Job Description',
        reference: 'Reference',
        unknown: 'Other / Auto'
      });

      function getSelectedEvidenceType() {
        const selected = knowledgeEvidenceType ? knowledgeEvidenceType.value : 'unknown';
        return Object.prototype.hasOwnProperty.call(EVIDENCE_TYPE_LABELS, selected)
          ? selected
          : 'unknown';
      }

      // Chat persistence and deduplication
      const CHAT_HISTORY_KEY = 'opencluely_chat_history_v1';
      const MAX_COMPLETE_PAIRS = 3;
      let chatHistory = [];
      let pairSequence = 0;
      const pendingPairIds = [];
      const streamingResponses = new Map();
      const completedMessageIds = new Set();
      const recentResponseHashes = new Set();
      const RECENT_HASH_LIMIT = 50;

      function hashString(str) {
        try {
          let h = 2166136261 >>> 0; // FNV-1a
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(16);
        } catch (_) {
          return String(str?.length || 0);
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory));
        } catch (e) {
          console.warn('Failed to save history', e);
        }
      }

      function createPairId() {
        pairSequence += 1;
        return `pair-${Date.now()}-${pairSequence}`;
      }

      function isNearMessagesBottom() {
        if (!chatMessages) return false;
        return chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 80;
      }

      function scrollMessagesIfNearBottom(wasNearBottom) {
        if (chatMessages && wasNearBottom) chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function getCompletedPairIds(items = chatHistory) {
        const pairs = new Map();
        items.forEach(item => {
          if (!item || item.kind !== 'message' || !item.pairId) return;
          const pair = pairs.get(item.pairId) || { pairId: item.pairId, user: false, assistant: false };
          if (item.type === 'user') pair.user = true;
          if (item.type === 'assistant' && item.complete !== false) pair.assistant = true;
          pairs.set(item.pairId, pair);
        });
        return Array.from(pairs.values())
          .filter(pair => pair.user && pair.assistant)
          .map(pair => pair.pairId);
      }

      function applyCompletedPairRetention(removeFromDom = true) {
        const completedPairIds = getCompletedPairIds();
        const excessCount = Math.max(0, completedPairIds.length - MAX_COMPLETE_PAIRS);
        if (!excessCount) return;
        const activePairIds = new Set(Array.from(streamingResponses.values()).map(stream => stream.pairId));
        const removable = new Set(completedPairIds.slice(0, excessCount).filter(pairId => !activePairIds.has(pairId)));
        if (!removable.size) return;
        chatHistory = chatHistory.filter(item => !item.pairId || !removable.has(item.pairId));
        if (removeFromDom && chatMessages) {
          chatMessages.querySelectorAll('[data-pair-id]').forEach(element => {
            if (removable.has(element.dataset.pairId)) element.remove();
          });
        }
      }

      function normalizeLoadedHistory(items) {
        let currentPairId = null;
        return items.map(item => {
          if (!item) return item;
          if (item.kind === 'snippet' && currentPairId && !item.pairId) {
            return { ...item, pairId: currentPairId };
          }
          if (item.kind !== 'message') return item;
          if (item.pairId) {
            if (item.type === 'user') currentPairId = item.pairId;
            return item;
          }
          if (item.type === 'user') {
            currentPairId = createPairId();
            return { ...item, pairId: currentPairId };
          }
          if (item.type === 'assistant' && currentPairId) {
            return { ...item, pairId: currentPairId, complete: true };
          }
          return item;
        });
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(CHAT_HISTORY_KEY);
          if (!raw) return;
          const items = JSON.parse(raw);
          if (Array.isArray(items)) {
            chatHistory = normalizeLoadedHistory(items);
            applyCompletedPairRetention(false);
            chatHistory.forEach(item => {
              if (item.type === 'assistant' && item.messageId) completedMessageIds.add(item.messageId);
            });
            // Render
            chatHistory.forEach(item => {
              if (item.kind === 'message') {
                addMessage(item.text, item.type, true, item);
              } else if (item.kind === 'snippet') {
                addCodeSnippet(item.language, item.code, true, item);
              }
            });
            saveHistory();
          }
        } catch (e) {
          console.warn('Failed to load history', e);
        }
      }

      function clearChatHistory(skipConfirm = false) {
        if (!skipConfirm) {
          const ok = confirm('Clear chat history?');
          if (!ok) return;
        }
        chatHistory = [];
        pendingPairIds.length = 0;
        streamingResponses.clear();
        completedMessageIds.clear();
        saveHistory();
        // Clear DOM
        if (chatMessages) chatMessages.innerHTML = '';
        if (whysperAPI?.clearSessionTelemetry) {
          whysperAPI.clearSessionTelemetry().catch(error => {
            console.error('Failed to clear session telemetry:', error);
          });
        }
      }

      async function initSpeechAvailability() {
        try {
          if (window.electronAPI && window.electronAPI.getSpeechAvailability) {
            speechAvailable = await window.electronAPI.getSpeechAvailability();
          }
        } catch (e) {
          speechAvailable = false;
        }
      }

      function updateSessionDocumentStripVisibility() {
        if (!sessionDocumentStrip || !sessionDocumentChips || !sessionDocumentStatus) return;
        const hasDocuments = sessionDocumentChips.childElementCount > 0;
        const hasStatus = !!sessionDocumentStatus.textContent;
        sessionDocumentStrip.hidden = !hasDocuments && !hasStatus;
        if (sessionDocumentHeader) {
          sessionDocumentHeader.style.display = hasDocuments ? '' : 'none';
        }
        if (clearSessionDocumentsBtn) {
          clearSessionDocumentsBtn.style.display = hasDocuments ? '' : 'none';
        }
      }

      function setSessionDocumentStatus(message = '', isError = false) {
        if (!sessionDocumentStatus) return;
        if (sessionDocumentStatusTimer) {
          clearTimeout(sessionDocumentStatusTimer);
          sessionDocumentStatusTimer = null;
        }
        sessionDocumentStatus.textContent = message;
        sessionDocumentStatus.classList.toggle('error', isError);
        updateSessionDocumentStripVisibility();
        if (message && isError) {
          sessionDocumentStatusTimer = setTimeout(() => {
            sessionDocumentStatus.textContent = '';
            sessionDocumentStatus.classList.remove('error');
            updateSessionDocumentStripVisibility();
          }, 4500);
        }
      }

      function renderSessionDocuments(documents = []) {
        if (!sessionDocumentChips) return;
        sessionDocumentChips.replaceChildren();
        if (sessionDocumentCount) {
          sessionDocumentCount.textContent = documents.length > 0
            ? `Knowledge Sources (${documents.length})`
            : '';
        }

        documents.forEach(documentSummary => {
          const chip = document.createElement('div');
          chip.className = 'session-document-chip';

          const name = document.createElement('span');
          name.className = 'session-document-name';
          name.textContent = documentSummary.name;
          name.title = documentSummary.name;

          const authority = document.createElement('span');
          authority.className = 'session-document-authority';
          authority.textContent = EVIDENCE_TYPE_LABELS[documentSummary.evidenceType] || EVIDENCE_TYPE_LABELS.unknown;

          const status = document.createElement('span');
          status.className = 'session-document-index-status';
          status.textContent = documentSummary.status || 'Indexed';

          const remove = document.createElement('button');
          remove.className = 'session-document-remove';
          remove.type = 'button';
          remove.title = `Remove ${documentSummary.name}`;
          remove.setAttribute('aria-label', `Remove ${documentSummary.name}`);
          remove.textContent = '×';
          remove.addEventListener('click', async () => {
            remove.disabled = true;
            try {
              const result = await whysperAPI.removeSessionDocument(documentSummary.id);
              renderSessionDocuments(result.documents || []);
            } catch (error) {
              console.error('Failed to remove session document:', error);
              setSessionDocumentStatus('Could not remove file', true);
              remove.disabled = false;
            }
          });

          chip.append(name, authority, status, remove);
          sessionDocumentChips.appendChild(chip);
        });

        updateSessionDocumentStripVisibility();
      }

      async function loadSessionDocuments() {
        try {
          if (!whysperAPI || !whysperAPI.getSessionDocuments) return;
          const documents = await whysperAPI.getSessionDocuments();
          renderSessionDocuments(Array.isArray(documents) ? documents : []);
        } catch (error) {
          console.error('Failed to load session documents:', error);
          setSessionDocumentStatus('Could not load files', true);
        }
      }
      
      // Listen for availability changes
      if (whysperAPI && whysperAPI.onSpeechAvailability) {
        whysperAPI.onSpeechAvailability((event, data) => {
          speechAvailable = !!(data && data.available);
          applyMicVisibility();
        });
      }
      
      // Also capture generic LLM responses (from OCR/screenshot flows)
      if (whysperAPI && whysperAPI.onLlmResponse) {
        whysperAPI.onLlmResponse((event, data) => {
          try { hideThinkingIndicator(); } catch (_) {}
          if (data && data.response) {
            renderAssistantResponse(data.response);
          }
        });
      }

      // Clear on session-cleared from main
      if (whysperAPI && whysperAPI.onSessionCleared) {
        whysperAPI.onSessionCleared(() => {
          clearChatHistory(true);
          renderSessionDocuments([]);
        });
      }

      // Initialize availability and history
      loadHistory();
      initSpeechAvailability();
      loadSessionDocuments();

      // Basic message function with markdown support for assistant messages
      function addMessage(text, type = 'user', skipPersist = false, metadata = {}) {
        if (!chatMessages) {
          console.error('Chat messages element not found!');
          return null;
        }

        const wasNearBottom = isNearMessagesBottom();
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;
        if (metadata.pairId) messageDiv.dataset.pairId = metadata.pairId;
        if (metadata.messageId) messageDiv.dataset.messageId = metadata.messageId;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        
        // Format assistant messages as markdown
        if (type === 'assistant') {
          textDiv.innerHTML = formatMarkdown(text);
          if (window.renderMathInElement) window.renderMathInElement(textDiv);
        } else {
          textDiv.textContent = text;
        }

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);

        chatMessages.appendChild(messageDiv);
        scrollMessagesIfNearBottom(wasNearBottom);

        if (!skipPersist) {
          chatHistory.push({ kind: 'message', type, text, ...metadata });
          saveHistory();
        }
        return messageDiv;
      }

      // Markdown formatter using markdown.js library
      function formatMarkdown(text) {
        if (!text) return '';
        
        try {
          if (typeof markdown !== 'undefined' && markdown.toHTML) {
            return markdown.toHTML(text);
          } else {
            console.warn('Markdown library not loaded, falling back to basic formatting');
            return text
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\*(.+?)\*/g, '<em>$1</em>')
              .replace(/`(.+?)`/g, '<code>$1</code>')
              .replace(/\n/g, '<br>');
          }
        } catch (error) {
          console.error('Markdown parsing failed:', error);
          return text.replace(/\n/g, '<br>');
        }
      }

      // Show thinking indicator
      function showThinkingIndicator(pairId = '') {
        if (pairId && !pendingPairIds.includes(pairId)) return;
        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'message assistant thinking';
        thinkingDiv.dataset.thinkingFor = pairId;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text thinking-dots';
        textDiv.innerHTML = '<span class="dot">•</span><span class="dot">•</span><span class="dot">•</span>';

        thinkingDiv.appendChild(timeDiv);
        thinkingDiv.appendChild(textDiv);

        const wasNearBottom = isNearMessagesBottom();
        chatMessages.appendChild(thinkingDiv);
        scrollMessagesIfNearBottom(wasNearBottom);
      }

      // Hide thinking indicator
      function hideThinkingIndicator(pairId = '') {
        const selector = pairId
          ? `[data-thinking-for="${CSS.escape(pairId)}"]`
          : '.message.assistant.thinking';
        const thinkingIndicator = chatMessages && chatMessages.querySelector(selector);
        if (thinkingIndicator) {
          thinkingIndicator.remove();
        }
      }

      // Minimalist Listening Animation Functions
      function showListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.add('active');

          // Start timer
          listeningStartTime = Date.now();
          listeningTimer = setInterval(() => {
            if (listeningStartTime && listeningDuration) {
              const elapsed = Math.floor((Date.now() - listeningStartTime) / 1000);
              listeningDuration.textContent = `${elapsed}s`;
            }
          }, 1000);
        }
      }

      function hideListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.remove('active');
        }

        // Hide interim overlay
        if (interimOverlay) {
          interimOverlay.classList.remove('active');
        }

        // Clear timer
        if (listeningTimer) {
          clearInterval(listeningTimer);
          listeningTimer = null;
        }

        listeningStartTime = null;
      }

      function showInterimText(text) {
        if (!interimOverlay) return;

        if (text && text.trim()) {
          interimOverlay.textContent = text;
          interimOverlay.classList.add('active');
        } else {
          interimOverlay.classList.remove('active');
        }
      }

      // Recording Event Handlers
      function handleRecordingStarted() {
        isRecording = true;

        if (recordingIndicator) {
          recordingIndicator.style.display = 'block';
        }

        showListeningAnimation();
      }

      function handleRecordingStopped() {
        isRecording = false;

        if (recordingIndicator) {
          recordingIndicator.style.display = 'none';
        }

        hideListeningAnimation();
        addMessage('Stopped Listening', 'system');
      }

      function handleTranscription(text) {
        if (text && typeof text === 'string' && text.trim().length > 0) {
          // Hide listening animation first
          hideListeningAnimation();

          // Show transcribed text with slight delay for smooth transition
          setTimeout(() => {
            addMessage(text.trim(), 'transcription');
            
            // Show thinking indicator after transcription
            setTimeout(() => {
              showThinkingIndicator();
            }, 300);
          }, 200);
        } else {
          console.warn('Invalid or empty transcription text - ignoring:', text);
        }
      }

      // Helpers to capture AI response into chat (text + snippets)
      function extractCodeBlocks(text) {
        if (!text) return [];
        const blocks = [];
        const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
        let match;
        while ((match = regex.exec(text)) !== null) {
          const info = (match[2] || '').trim();
          const langToken = info.split(/\s+/)[0] || 'text';
          blocks.push({ language: langToken, code: match[3], fullMatch: match[0] });
        }
        return blocks;
      }
      function stripCodeBlocks(text, blocks) {
        let result = text || '';
        blocks.forEach(b => { result = result.replace(b.fullMatch, ''); });
        return result.replace(/\n\s*\n\s*\n/g, '\n\n').trim();
      }
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
      }
      function attachCopy(btn, codeText) {
        if (!btn) return;
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          try {
            let ok = false;
            if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
              ok = await window.electronAPI.copyToClipboard(codeText);
            }
            if (!ok) {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(codeText);
                ok = true;
              } else {
                const ta = document.createElement('textarea');
                ta.value = codeText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                ok = true;
              }
            }
            if (ok) {
              btn.classList.add('copied');
              const original = btn.textContent;
              btn.textContent = 'Copied';
              setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
            }
          } catch (err) {
            console.warn('Copy failed', err);
          }
        });
      }
      function addCodeSnippet(language, code, skipPersist = false, metadata = {}) {
        if (!chatMessages) return;
        const wasNearBottom = isNearMessagesBottom();
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        if (metadata.pairId) messageDiv.dataset.pairId = metadata.pairId;
        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';

        const lang = (language || 'text').toLowerCase();
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.className = `language-${lang}`;
        codeEl.innerHTML = escapeHtml(code || '');

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        attachCopy(copyBtn, code || '');

        pre.appendChild(copyBtn);
        pre.appendChild(codeEl);
        
        const label = document.createElement('div');
        label.style.cssText = 'font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:6px;';
        label.textContent = `Snippet: ${lang.toUpperCase()}`;

        textDiv.appendChild(label);
        textDiv.appendChild(pre);

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);
        chatMessages.appendChild(messageDiv);
        scrollMessagesIfNearBottom(wasNearBottom);

        try { if (window.Prism && Prism.highlightElement) { Prism.highlightElement(codeEl); } } catch (_) {}

        if (!skipPersist) {
          chatHistory.push({ kind: 'snippet', language: lang, code: code || '', ...metadata });
          saveHistory();
        }
      }

      function enhanceAssistantCodeBlocks(container) {
        if (!container) return;
        container.querySelectorAll('pre').forEach(pre => {
          if (pre.querySelector('.copy-btn')) return;
          const code = pre.querySelector('code');
          if (!code) return;
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.textContent = 'Copy';
          attachCopy(copyBtn, code.textContent || '');
          pre.prepend(copyBtn);
          try { if (window.Prism && Prism.highlightElement) Prism.highlightElement(code); } catch (_) {}
        });
      }

      function renderAssistantText(textDiv, text) {
        if (!textDiv) return;
        textDiv.innerHTML = formatMarkdown(text || '');
        enhanceAssistantCodeBlocks(textDiv);
        if (window.renderMathInElement) window.renderMathInElement(textDiv);
      }

      function startUserPair(text) {
        const pairId = createPairId();
        pendingPairIds.push(pairId);
        addMessage(text, 'user', false, { pairId, complete: false });
        return pairId;
      }

      function startAssistantStream(messageId, interactionId = null) {
        if (!messageId || streamingResponses.has(messageId) || completedMessageIds.has(messageId)) return;
        const pairId = pendingPairIds.shift() || createPairId();
        hideThinkingIndicator(pairId);
        const element = addMessage('', 'assistant', true, { pairId, messageId, complete: false });
        if (!element) return;
        streamingResponses.set(messageId, {
          pairId,
          element,
          textDiv: element.querySelector('.message-text'),
          text: '',
          interactionId
        });
      }

      function appendAssistantStream(messageId, delta, interactionId = null) {
        if (!messageId || typeof delta !== 'string') return;
        if (!streamingResponses.has(messageId)) startAssistantStream(messageId, interactionId);
        const stream = streamingResponses.get(messageId);
        if (!stream) return;
        if (!stream.interactionId && interactionId) stream.interactionId = interactionId;
        const wasNearBottom = isNearMessagesBottom();
        const isFirstChunk = stream.text.length === 0 && delta.length > 0;
        stream.text += delta;
        renderAssistantText(stream.textDiv, stream.text);
        if (isFirstChunk) acknowledgeTelemetryRender(stream.interactionId, 'chat');
        scrollMessagesIfNearBottom(wasNearBottom);
      }

      function acknowledgeTelemetryRender(interactionId, target) {
        if (!interactionId || !whysperAPI?.acknowledgeTelemetryRender) return;
        requestAnimationFrame(() => {
          whysperAPI.acknowledgeTelemetryRender(interactionId, target);
        });
      }

      function completeAssistantStream(messageId, response) {
        if (!messageId) return false;
        if (completedMessageIds.has(messageId)) return true;
        if (!streamingResponses.has(messageId)) startAssistantStream(messageId);
        const stream = streamingResponses.get(messageId);
        if (!stream) return false;
        const finalText = typeof response === 'string' && response.length ? response : stream.text;
        const wasNearBottom = isNearMessagesBottom();
        const renderedDuringStream = stream.text.length > 0;
        stream.text = finalText;
        renderAssistantText(stream.textDiv, finalText);
        if (!renderedDuringStream && finalText) acknowledgeTelemetryRender(stream.interactionId, 'chat');
        streamingResponses.delete(messageId);
        completedMessageIds.add(messageId);

        const userEntry = chatHistory.find(item => item.pairId === stream.pairId && item.type === 'user');
        if (userEntry) userEntry.complete = true;
        chatHistory.push({
          kind: 'message',
          type: 'assistant',
          text: finalText,
          pairId: stream.pairId,
          messageId,
          complete: true
        });
        applyCompletedPairRetention(true);
        saveHistory();
        scrollMessagesIfNearBottom(wasNearBottom);
        return true;
      }

      function renderAssistantResponse(response) {
        if (!response || typeof response !== 'string') return;
        // Deduplication: avoid processing the same response twice
        const normalized = response.trim();
        const h = hashString(normalized);
        if (recentResponseHashes.has(h)) return;
        recentResponseHashes.add(h);
        if (recentResponseHashes.size > RECENT_HASH_LIMIT) {
          const first = recentResponseHashes.values().next().value;
          recentResponseHashes.delete(first);
        }

        const blocks = extractCodeBlocks(response);
        const textOnly = stripCodeBlocks(response, blocks);
        // Add text response first (if any)
        if (textOnly && textOnly.trim().length) {
          addMessage(textOnly, 'assistant');
        }
        // Add each code snippet separately
        blocks.forEach(b => addCodeSnippet(b.language, b.code));
      }

      // Basic IPC Event Listeners - simplified
      
      // Listen for transcription events
      if (whysperAPI) {
        whysperAPI.onTranscriptionReceived((event, data) => {
          if (data && data.text) {
            handleTranscription(data.text);
          } else {
            console.warn('Invalid transcription data received:', data);
          }
        });

        whysperAPI.onInterimTranscription((event, data) => {
          if (data && data.text) {
            showInterimText(data.text);
          }
        });

        // Listen for speech status
        whysperAPI.onSpeechStatus((event, data) => {
          if (data && data.status) {
            addMessage(data.status, 'system');
            const status = String(data.status).toLowerCase();

            if (status.includes('stopped') || status.includes('ended')) {
              handleRecordingStopped();
            } else if (status.includes('started')) {
              handleRecordingStarted();
            }
          }
        });

        // Listen for speech errors
        whysperAPI.onSpeechError((event, data) => {
          if (data && data.error) {
            addMessage(`Error in recognizing speech`, 'error');
            handleRecordingStopped();
          }
        });

        // Listen for other events
        whysperAPI.onRecordingStarted(() => {
          handleRecordingStarted();
        });

        whysperAPI.onRecordingStopped(() => {
          handleRecordingStopped();
        });

        whysperAPI.onSessionCleared(() => {
          addMessage('Session memory has been cleared', 'system');
        });

        // Replace transcription LLM handler to store text + snippets
        whysperAPI.onTranscriptionLlmResponseStart((event, data) => {
          if (data && data.messageId) startAssistantStream(data.messageId, data.interactionId || null);
        });

        whysperAPI.onTranscriptionLlmResponseChunk((event, data) => {
          if (data && data.messageId) {
            appendAssistantStream(data.messageId, data.delta || '', data.interactionId || null);
          }
        });

        whysperAPI.onTranscriptionLlmResponse((event, data) => {
          if (data && data.response) {
            const messageId = data.messageId || (data.metadata && data.metadata.messageId);
            if (!completeAssistantStream(messageId, data.response)) {
              try { hideThinkingIndicator(); } catch (_) {}
              renderAssistantResponse(data.response);
            }
          }
        });
      }

      // UI Event Listeners
      if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', () => clearChatHistory());
      }

      if (closeChatBtn) {
        closeChatBtn.addEventListener('click', () => {
          whysperAPI.closeWindow().catch(error => {
            console.error('Failed to hide Live Transcript & Chat:', error);
          });
        });
      }

      if (exportTranscriptBtn) {
        exportTranscriptBtn.addEventListener('click', async () => {
          exportTranscriptBtn.disabled = true;
          try {
            const result = await whysperAPI.exportSessionTelemetry();
            if (result && result.success) {
              setExportStatus('Transcript saved.');
            } else if (result && !result.canceled) {
              console.warn(result.error || 'Session transcript was not exported');
              setExportStatus('Could not save transcript.', true);
            }
          } catch (error) {
            console.error('Failed to export session transcript:', error);
            setExportStatus('Could not save transcript.', true);
          } finally {
            exportTranscriptBtn.disabled = false;
          }
        });
      }

      function setExportStatus(message, isError = false) {
        if (!exportStatus) return;
        if (exportStatusTimer) clearTimeout(exportStatusTimer);
        exportStatus.textContent = message;
        exportStatus.classList.toggle('error', isError);
        exportStatusTimer = setTimeout(() => {
          exportStatus.textContent = '';
          exportStatus.classList.remove('error');
          exportStatusTimer = null;
        }, 3000);
      }

      if (addSessionDocumentsBtn) {
        addSessionDocumentsBtn.addEventListener('click', async () => {
          addSessionDocumentsBtn.disabled = true;
          setSessionDocumentStatus('Processing...');
          try {
            const result = await whysperAPI.addSessionDocuments(getSelectedEvidenceType());
            if (!result.canceled) {
              renderSessionDocuments(result.documents || []);
            }
            if (result.errors && result.errors.length > 0) {
              const count = result.errors.length;
              setSessionDocumentStatus(`${count} file${count === 1 ? '' : 's'} could not be added`, true);
            } else {
              setSessionDocumentStatus('');
            }
          } catch (error) {
            console.error('Failed to add session documents:', error);
            setSessionDocumentStatus('Could not add files', true);
          } finally {
            addSessionDocumentsBtn.disabled = false;
          }
        });
      }

      function closeSessionUrlEntry() {
        if (!sessionUrlEntry || !sessionUrlInput) return;
        sessionUrlEntry.hidden = true;
        sessionUrlInput.value = '';
      }

      async function addSessionUrl() {
        const url = sessionUrlInput ? sessionUrlInput.value.trim() : '';
        if (!url) {
          setSessionDocumentStatus('Enter a public webpage URL', true);
          return;
        }

        submitSessionUrlBtn.disabled = true;
        if (showSessionUrlBtn) showSessionUrlBtn.disabled = true;
        setSessionDocumentStatus('Indexing...');
        try {
          const result = await whysperAPI.addSessionUrl(url, getSelectedEvidenceType());
          renderSessionDocuments(result.documents || []);
          if (!result.success) {
            setSessionDocumentStatus(result.error?.message || 'Could not add URL', true);
            return;
          }
          closeSessionUrlEntry();
          setSessionDocumentStatus('Indexed');
        } catch (error) {
          console.error('Failed to add session URL:', error);
          setSessionDocumentStatus('Could not add URL', true);
        } finally {
          submitSessionUrlBtn.disabled = false;
          if (showSessionUrlBtn) showSessionUrlBtn.disabled = false;
        }
      }

      if (showSessionUrlBtn) {
        showSessionUrlBtn.addEventListener('click', () => {
          sessionUrlEntry.hidden = false;
          sessionUrlInput.focus();
        });
      }

      if (submitSessionUrlBtn) {
        submitSessionUrlBtn.addEventListener('click', addSessionUrl);
      }

      if (cancelSessionUrlBtn) {
        cancelSessionUrlBtn.addEventListener('click', closeSessionUrlEntry);
      }

      if (sessionUrlInput) {
        sessionUrlInput.addEventListener('keydown', event => {
          if (event.key === 'Enter') {
            event.preventDefault();
            addSessionUrl();
          } else if (event.key === 'Escape') {
            closeSessionUrlEntry();
          }
        });
      }

      if (clearSessionDocumentsBtn) {
        clearSessionDocumentsBtn.addEventListener('click', async () => {
          clearSessionDocumentsBtn.disabled = true;
          try {
            await whysperAPI.clearSessionDocuments();
            renderSessionDocuments([]);
            setSessionDocumentStatus('');
          } catch (error) {
            console.error('Failed to clear session documents:', error);
            setSessionDocumentStatus('Could not clear files', true);
          } finally {
            clearSessionDocumentsBtn.disabled = false;
          }
        });
      }

      if (sendButton) {
        sendButton.addEventListener('click', async () => {
          const text = messageInput.value.trim();
          if (text) {
            const pairId = startUserPair(text);
            messageInput.value = '';
            
            // Show thinking indicator after user message
            setTimeout(() => {
              showThinkingIndicator(pairId);
            }, 300);
            
            // Send to main process for session memory storage and LLM processing
            try {
              if (whysperAPI && whysperAPI.sendChatMessage) {
                await whysperAPI.sendChatMessage(text);
              }
            } catch (error) {
              console.error('Failed to send chat message to main process:', error);
            }
          }
        });
      }

      if (addContextButton) {
        addContextButton.addEventListener('click', async () => {
          const text = messageInput.value.trim();
          if (!text) return;

          addContextButton.disabled = true;
          try {
            const result = await whysperAPI.addManualSessionContext(text);
            if (!result || !result.success) {
              throw new Error(result && result.message ? result.message : 'Unable to add session context');
            }

            messageInput.value = '';
            autoGrow(messageInput);
            const normalizedPreview = text.replace(/\s+/g, ' ');
            const preview = normalizedPreview.slice(0, 180);
            const suffix = normalizedPreview.length > 180 ? '...' : '';
            addMessage(`Session Context Added:\n"${preview}${suffix}"`, 'system', true);
          } catch (error) {
            console.error('Failed to add manual session context:', error);
            addMessage(`Could not add session context: ${error.message}`, 'system', true);
          } finally {
            addContextButton.disabled = false;
          }
        });
      }

      // Auto-resize for multiline textarea
      function autoGrow(el) {
        if (!el) return;
        el.style.height = 'auto';
        const max = 140; // keep within container limits
        el.style.height = Math.min(el.scrollHeight, max) + 'px';
      }
      if (messageInput) {
        autoGrow(messageInput);
        messageInput.addEventListener('input', () => autoGrow(messageInput));
      }

      // Replace keypress with keydown to support Shift+Enter for newline and Enter to send
      if (messageInput) {
        messageInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
              const pairId = startUserPair(text);
              messageInput.value = '';
              autoGrow(messageInput);
              setTimeout(() => { showThinkingIndicator(pairId); }, 300);
              try {
                if (whysperAPI && whysperAPI.sendChatMessage) {
                  await whysperAPI.sendChatMessage(text);
                }
              } catch (error) {
                console.error('Failed to send chat message to main process:', error);
              }
            }
          }
          // If Shift+Enter, allow default to insert newline
        });
      }

      // Initialize
      if (!chatHistory || chatHistory.length === 0) {
        addMessage('Recording in Progress. press Alt+M to stop recording.', 'system');
      }
    </script>
  </body>
</html>
